name: Build AI Player

concurrency:
  group: build-ai-player
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "latest/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build
        run: gradle build --no-daemon

      - name: Publish latest JAR into repository
        run: |
          git fetch origin main
          git reset --hard origin/main
          mkdir -p latest
          cp build/libs/ai-player-0.1.0.jar latest/ai-player.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest/ai-player.jar
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish latest AI Player JAR"
          git push origin HEAD:main

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ai-player-jar
          path: build/libs/ai-player-0.1.0.jar
          if-no-files-found: error
