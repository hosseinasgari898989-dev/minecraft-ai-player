name: Build and test AI Player (Java + Bedrock)

on:
  push:
    branches:
      - "arena/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Build Fabric mod and run Java tests
        run: gradle clean test build --no-daemon
      - name: Run Bedrock brain and manifest tests
        run: node --test tests/bedrock-and-parity.test.mjs
      - name: Package Bedrock Add-On and source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/distributions
          (cd bedrock/AIPlayer_BP && zip -qr ../../build/distributions/AIPlayer_BP.mcpack .)
          (cd bedrock/AIPlayer_RP && zip -qr ../../build/distributions/AIPlayer_RP.mcpack .)
          (cd build/distributions && zip -q AIPlayer-Bedrock-0.2.0.mcaddon AIPlayer_BP.mcpack AIPlayer_RP.mcpack)
          zip -qr build/distributions/minecraft-ai-player-dual-edition-source.zip .             -x ".git/*" ".gradle/*" "build/*" "latest/ai-player.jar"
          unzip -t build/distributions/AIPlayer-Bedrock-0.2.0.mcaddon
          unzip -t build/distributions/minecraft-ai-player-dual-edition-source.zip
      - name: Upload installable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIPlayer-Java-Fabric-and-Bedrock-0.2.0
          path: |
            build/libs/ai-player-0.2.0.jar
            build/distributions/AIPlayer-Bedrock-0.2.0.mcaddon
            build/distributions/AIPlayer_BP.mcpack
            build/distributions/AIPlayer_RP.mcpack
            build/distributions/minecraft-ai-player-dual-edition-source.zip
          if-no-files-found: error
