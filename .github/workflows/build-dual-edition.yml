name: Build and test AI Player (Java + Bedrock)

on:
  push:
    branches:
      - "arena/**"
    paths-ignore:
      - "latest/**"
      - "dist/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Build Fabric mod and run Java tests
        run: gradle clean test build --no-daemon
      - name: Run Bedrock brain and manifest tests
        run: node --test tests/bedrock-and-parity.test.mjs
      - name: Validate and package installers and source archive
        run: node tools/package-all.mjs
      - name: Publish direct-download artifacts to this feature branch
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/arena/')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist latest
          cp build/libs/ai-player-0.2.0.jar latest/ai-player.jar
          cp build/libs/ai-player-0.2.0.jar dist/ai-player.jar
          cp build/distributions/AIPlayer-Bedrock-0.2.0.mcaddon dist/
          cp build/distributions/AIPlayer_BP.mcpack dist/
          cp build/distributions/AIPlayer_RP.mcpack dist/
          cp build/distributions/minecraft-ai-player-dual-edition-source.zip dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest/ai-player.jar dist/
          if git diff --cached --quiet; then
            echo "Installable artifacts are already current."
          else
            git commit -m "chore: publish verified dual-edition installers [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload installable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIPlayer-Java-Fabric-and-Bedrock-0.2.0
          path: |
            build/libs/ai-player-0.2.0.jar
            build/distributions/AIPlayer-Bedrock-0.2.0.mcaddon
            build/distributions/AIPlayer_BP.mcpack
            build/distributions/AIPlayer_RP.mcpack
            build/distributions/minecraft-ai-player-dual-edition-source.zip
          if-no-files-found: error
