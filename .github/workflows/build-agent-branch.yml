name: Build AI Agent Branch
# Trigger verification build after local AI configuration support.

on:
  push:
    branches: ["ai-agent-architecture-1.20.6"]
    paths-ignore:
      - "latest/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build
        run: gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ai-player-agent-jar
          path: build/libs/ai-player-0.1.0.jar
          if-no-files-found: error
